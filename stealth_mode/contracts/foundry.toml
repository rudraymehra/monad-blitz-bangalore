[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Verification metadata (real Foundry keys; same effect as the docs' aliases)
bytecode_hash = "none"      # no ipfs hash in bytecode -> deterministic verify
cbor_metadata = true
use_literal_content = true  # embed source for sourcify

# Monad Testnet
eth-rpc-url = "https://testnet-rpc.monad.xyz"
chain_id = 10143

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
